<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrainingTrail — Trail des Forts 72 km</title>
<link rel="stylesheet" href="css/style.css?v=2026102201">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo">⛰</span>
    <div>
      <div class="brand-title">TrainingTrail</div>
      <div class="brand-sub">Trail des Forts — 72 km, 2 800 m D+ — 9 mai 2027</div>
    </div>
  </div>
  <div class="topstats">
    <div class="tstat"><span id="hdr-week">S1</span><label>Semaine</label></div>
    <div class="tstat"><span id="hdr-j">200</span><label>Jours avant course</label></div>
    <div class="tstat"><span id="hdr-done">0%</span><label>Programme réalisé</label></div>
  </div>
</header>

<nav id="tabs">
  <button data-view="today" class="active">Aujourd'hui</button>
  <button data-view="program">Programme</button>
  <button data-view="exercises">Exercices</button>
  <button data-view="runs">Sorties</button>
  <button data-view="shoes">Chaussures</button>
  <button data-view="progress">Progression</button>
  <button data-view="coach">Coach IA</button>
  <button data-view="settings">Réglages</button>
</nav>

<main>
  <section id="view-today" class="view active"></section>
  <section id="view-program" class="view"></section>
  <section id="view-exercises" class="view"></section>
  <section id="view-runs" class="view"></section>
  <section id="view-shoes" class="view"></section>
  <section id="view-progress" class="view"></section>
  <section id="view-coach" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<footer id="foot">
  Programme personnalisé du 19/10/2026 au 09/05/2027 · Les données restent dans ce navigateur (localStorage).
  <div id="storage-mode"></div>
  <div id="save-stamp"></div>
</footer>

<!-- Timer modal -->
<div id="timer-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="timer-title">Minuteur</h3><button class="icon-btn" id="timer-close">✕</button></div>
    <div class="timer-phase" id="timer-phase">Préparation</div>
    <div class="timer-clock" id="timer-clock">00:30</div>
    <div class="timer-round" id="timer-round"></div>
    <div class="timer-cfg" id="timer-cfg">
      <label>Travail (s) <input type="number" id="cfg-work" min="1" max="3600"></label>
      <label>Récup (s) <input type="number" id="cfg-rest" min="0" max="3600"></label>
      <label>Répétitions <input type="number" id="cfg-reps" min="1" max="60"></label>
      <label>Séries <input type="number" id="cfg-sets" min="1" max="20"></label>
      <label>Récup série (s) <input type="number" id="cfg-setrest" min="0" max="1800"></label>
    </div>
    <div class="timer-actions">
      <button id="timer-startstop" class="btn primary">Démarrer</button>
      <button id="timer-reset" class="btn">Réinitialiser</button>
      <button id="timer-done" class="btn">Série faite</button>
    </div>
    <div class="timer-extras" id="timer-extras"></div>
  </div>
</div>

<!-- Exercise modal -->
<div id="exo-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head"><h3 id="exo-title">Exercice</h3><button class="icon-btn" id="exo-close">✕</button></div>
    <div id="exo-body"></div>
    <div class="modal-nav" id="exo-nav"></div>
  </div>
</div>

<!-- Session player : déroulement guidé d'une routine de renforcement -->
<div id="player-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head"><h3 id="player-title">Séance</h3><button class="icon-btn" id="player-close">✕</button></div>
    <div id="player-progress"></div>
    <div id="player-body"></div>
    <div class="timer-actions" id="player-actions"></div>
  </div>
</div>

<!-- Modification d'une sortie (km, temps, D+, feedback) -->
<div id="edit-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="edit-title">Modifier la sortie</h3><button class="icon-btn" id="edit-close">✕</button></div>
    <div id="edit-gpshint"></div>
    <div class="form-grid" id="edit-form"></div>
    <div class="row-actions"><button class="btn primary" id="edit-save">Enregistrer</button></div>
  </div>
</div>

<!-- Info type de séance -->
<div id="info-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="info-title">Séance</h3><button class="icon-btn" id="info-close">✕</button></div>
    <div id="info-body"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="js/data.js?v=2026102201"></script>
<script src="js/anim.js?v=2026102201"></script>
<script src="js/gpx.js?v=2026102201"></script>
<script src="js/app.js?v=2026102201"></script>
</body>
</html>
